name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore App.config for CI
        shell: pwsh
        run: Copy-Item ./Zeron.Demand/App.Sample.config ./Zeron.Demand/App.config -Force

      - name: Restore
        run: dotnet restore Zeron.sln

      - name: Build
        run: dotnet build Zeron.sln -c Release --no-restore

      - name: Build Demand
        run: dotnet build Zeron.Demand/Zeron.Demand.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Zeron.sln -c Release --no-build --verbosity normal
